# Bastardpedia CI. Layout follows ChronoTeach; details in docs/CI.md.
#
#   checks      every pipeline except tags and schedules: type-check, lint,
#               format, unit tests, tag validation, deploy-config drift.
#   build       when something that renders changed: catalog, build, e2e.
#   release     tags: version check, checks, catalog, build, e2e.
#   deploy_web  version tags, after release: the tested dist/ to the server.
#   feed_sync   scheduled (weekly): pulls the feed and fails when new stories
#               need tagging. Tagging itself runs on a workstation (docs/TAGGING.md).
#
# Everything runs in Playwright's image. Its tag comes from PLAYWRIGHT_VERSION,
# and `checks` fails if that drifts from @playwright/test in package-lock.json.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        NPM_CACHE_POLICY: pull-push
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - build
  - deploy

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  interruptible: true
  timeout: 20m

variables:
  HUSKY: '0'
  FF_USE_INIT_WITH_DOCKER_EXECUTOR: 'true'
  npm_config_cache: $CI_PROJECT_DIR/.npm
  NPM_CACHE_POLICY: pull
  PLAYWRIGHT_VERSION: '1.64.1'

.node:
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: $NPM_CACHE_POLICY
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

.renders: &renders
  - src/**/*
  - shared/**/*
  - pipeline/**/*
  - data/tags/**/*
  - data/overrides/**/*
  - data/stories.json
  - tagging/taxonomy/**/*
  - public/**/*
  - e2e/**/*
  - design-tokens.json
  - index.html
  - vite.config.ts
  - playwright.config.ts
  - tsconfig*.json
  - package.json
  - package-lock.json
  - .gitlab-ci.yml

checks:
  extends: .node
  stage: test
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - when: on_success
  script:
    - >
      test "$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" = "$PLAYWRIGHT_VERSION"
      || { echo "PLAYWRIGHT_VERSION in .gitlab-ci.yml does not match package-lock.json"; exit 1; }
    - npm run tokens
    - npm run icons
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm test
    - npm run tags:validate
    - node scripts/deploy-config.mjs --check

build:
  extends: .node
  stage: build
  needs: [checks]
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        paths: *renders
        compare_to: refs/heads/main
    - changes: *renders
  script:
    - npm run build:catalog
    - npm run build
    - npm run e2e
  artifacts:
    name: bastardpedia-$CI_COMMIT_REF_SLUG
    paths:
      - dist/
    expire_in: 1 week

release:
  extends: .node
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/release.mjs check-version "$CI_COMMIT_TAG"
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run tags:validate
    - npm run build:catalog
    - npm run build
    - npm run e2e
  artifacts:
    name: bastardpedia-$CI_COMMIT_REF_SLUG
    paths:
      - dist/
    expire_in: 90 days

# The Apollyon standard deploy: an Alpine job, SSH as app-runner with a key only
# this repository uses. It ships the exact dist/ that release tested. Host and
# path come from project.config.json. Caddy needs no reload for new content;
# a change to deploy/Caddyfile does, by an admin (docs/DEPLOYMENT.md).
#
# Needs SSH_PRIVATE_KEY (base64, masked, protected), SERVER_IP, and while the
# site is private SITE_AUTH ("user:password", masked, protected). Tags v* protected.
deploy_web:
  stage: deploy
  image: alpine:3.22
  needs: [release]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  resource_group: production
  interruptible: false
  cache: []
  environment:
    name: production
    url: https://bastardpedia.ramsus.site
  before_script:
    - apk add --no-cache openssh-client rsync curl jq
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - HOST=$(jq -r .host project.config.json)
    - TARGET=$(jq -r .deployPath project.config.json)
    - rsync -a --chmod=D2775,F664 --delete-after --delay-updates dist/ "app-runner@$SERVER_IP:$TARGET/dist/"
    # The page Caddy serves must be byte-identical to the artifact, asked from the server itself.
    - AUTH=""; if [ -n "$SITE_AUTH" ]; then AUTH="-u $SITE_AUTH"; fi
    - ssh "app-runner@$SERVER_IP" "curl -fsS $AUTH --resolve $HOST:443:127.0.0.1 https://$HOST/" > live.html
    - cmp live.html dist/index.html

# Weekly: pull the feed and report stories that still need tags. Create the
# schedule in GitLab (CI/CD > Schedules). It fails, and so notifies, when the
# feed has stories without tags; data/ changes are not committed back.
feed_sync:
  extends: .node
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  script:
    - npm run pipeline:ingest
    - npm run pipeline:group
    - node pipeline/status.ts --fail-on-untagged
  artifacts:
    when: always
    paths:
      - data/stories.json
    expire_in: 2 weeks
