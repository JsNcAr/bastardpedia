# Named time windows. NOT chosen by the tagging agent: the app derives them by
# checking whether a story's time span overlaps [start, end].
#   - `end: null` means "to the present".
#   - Years are integers; negative = BCE.
#   - `region_hint` is only a UI label ("Victorian (UK)"); matching is by time only,
#     so "Victorian" also finds a German archaeologist working in Turkey in the 1870s.
#   - `scope: global` eras show in the main era picker; `scope: regional` eras show
#     grouped under their region hint.
#   - Centuries ("19th century", "1st century BCE") are NOT listed here: the app computes
#     them from the years.
#   - Matching uses time.main_span only. These filters are orientative, not exact.
facet: eras
derived: true
values:
  # Global
  - { id: ancient, label: Ancient world, start: -3000, end: 499, scope: global }
